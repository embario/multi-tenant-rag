name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_rag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Load CI env vars
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            if [[ -z "$key" || "$key" =~ ^# ]]; then
              continue
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .env.ci
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/test_rag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Run migrations (if applicable)
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          fi

      - name: Pytest
        run: cd app/ && pytest
